# 格物 IoT 平台 —— 单机部署 compose（纯 Spring Boot 模块化单体）
# 镜像走国内镜像源（本机 Docker Hub 不可达）：统一 daocloud
name: materin

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: materin-mysql
    restart: unless-stopped
    command:
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: materin
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    container_name: materin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  emqx:
    image: docker.m.daocloud.io/emqx/emqx:5.8.6
    container_name: materin-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_ADMIN_PASSWORD:-public}
      # 无状态引导：认证/授权全量委托后端 HTTP 回调（账号在平台 MySQL：
      # 设备 deviceKey/secret、服务账号 materin-svc-*、开发者 AK/SK）。
      # 数据卷被删除重建后，此处可完整恢复鉴权配置，无需手工进 Dashboard。
      EMQX_AUTHENTICATION__1__ENABLE: "true"
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: http
      EMQX_AUTHENTICATION__1__METHOD: post
      EMQX_AUTHENTICATION__1__URL: http://backend:8080/api/v1/mqtt/auth
      EMQX_AUTHENTICATION__1__BODY: '{"username": "$${username}", "password": "$${password}"}'
      EMQX_AUTHENTICATION__1__HEADERS__content-type: application/json
      EMQX_AUTHENTICATION__1__CONNECT_TIMEOUT: 5s
      EMQX_AUTHENTICATION__1__REQUEST_TIMEOUT: 5s
      EMQX_AUTHENTICATION__1__POOL_SIZE: 8
      # 未命中任何授权源时默认拒绝；授权同样回调后端（设备限自身 namespace）
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: http
      EMQX_AUTHORIZATION__SOURCES__1__METHOD: post
      EMQX_AUTHORIZATION__SOURCES__1__URL: http://backend:8080/api/v1/mqtt/acl
      EMQX_AUTHORIZATION__SOURCES__1__BODY: '{"username": "$${username}", "topic": "$${topic}", "action": "$${action}"}'
      EMQX_AUTHORIZATION__SOURCES__1__HEADERS__content-type: application/json
      EMQX_AUTHORIZATION__SOURCES__1__CONNECT_TIMEOUT: 5s
      EMQX_AUTHORIZATION__SOURCES__1__REQUEST_TIMEOUT: 5s
      EMQX_AUTHORIZATION__SOURCES__1__POOL_SIZE: 8
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  iotdb:
    # Apache IoTDB 时序数据库（官方 standalone 镜像，6667 RPC）
    image: apache/iotdb:2.0.11-standalone
    container_name: materin-iotdb
    restart: unless-stopped
    ports:
      - "6667:6667"
      - "18080:18080"
    volumes:
      - iotdb-data:/opt/iotdb/data
    environment:
      TZ: Asia/Shanghai
      # RPC 绑所有网卡（镜像默认 127.0.0.1，跨容器不可达；entrypoint 会把全小写 env 合入 iotdb-system.properties）
      dn_rpc_address: 0.0.0.0
    healthcheck:
      # 健康检查必须走容器 hostname（eth0），确保跨容器可达而非仅 loopback
      test: ["CMD-SHELL", "/iotdb/sbin/start-cli.sh -h 127.0.0.1 -e 'SHOW DATABASES' >/dev/null 2>&1 && /iotdb/sbin/start-cli.sh -h iotdb -e 'SHOW DATABASES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

  emqx2:
    # EMQX-2（open broker）：第三方开发者接入（核心架构，不可缺失）。
    # 开发者用 AK/SK（open_app.app_key/app_secret）连接，仅允许 open/ 命名空间；
    # 鉴权/授权回调 open 专用接口（仅服务账号 + AK/SK，设备凭证拒绝），
    # 账号全量在平台 MySQL，broker 无状态可随时重建。
    image: docker.m.daocloud.io/emqx/emqx:5.8.6
    container_name: materin-emqx2
    restart: unless-stopped
    ports:
      - "11883:1883"
      - "18084:18083"
    volumes:
      - emqx2-data:/opt/emqx/data
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX2_ADMIN_PASSWORD:-public}
      EMQX_AUTHENTICATION__1__ENABLE: "true"
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: http
      EMQX_AUTHENTICATION__1__METHOD: post
      EMQX_AUTHENTICATION__1__URL: http://backend:8080/api/v1/mqtt/open/auth
      EMQX_AUTHENTICATION__1__BODY: '{"username": "$${username}", "password": "$${password}"}'
      EMQX_AUTHENTICATION__1__HEADERS__content-type: application/json
      EMQX_AUTHENTICATION__1__CONNECT_TIMEOUT: 5s
      EMQX_AUTHENTICATION__1__REQUEST_TIMEOUT: 5s
      EMQX_AUTHENTICATION__1__POOL_SIZE: 8
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: http
      EMQX_AUTHORIZATION__SOURCES__1__METHOD: post
      EMQX_AUTHORIZATION__SOURCES__1__URL: http://backend:8080/api/v1/mqtt/open/acl
      EMQX_AUTHORIZATION__SOURCES__1__BODY: '{"username": "$${username}", "topic": "$${topic}", "action": "$${action}"}'
      EMQX_AUTHORIZATION__SOURCES__1__HEADERS__content-type: application/json
      EMQX_AUTHORIZATION__SOURCES__1__CONNECT_TIMEOUT: 5s
      EMQX_AUTHORIZATION__SOURCES__1__REQUEST_TIMEOUT: 5s
      EMQX_AUTHORIZATION__SOURCES__1__POOL_SIZE: 8
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  emqx-init:
    # 一次性配置任务：等 emqx/emqx2/backend 全部 healthy 后，
    # 幂等写入认证/授权（与 env 引导一致）+ 双向桥接（连接器/动作/规则）。
    # docker compose up -d 全栈启动即自动配好 EMQX 全部内容，无需手工跑脚本。
    image: docker.m.daocloud.io/curlimages/curl:8.11.0
    container_name: materin-emqx-init
    restart: on-failure:3
    depends_on:
      emqx:
        condition: service_healthy
      emqx2:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./emqx-configure.sh:/app/emqx-configure.sh:ro
    entrypoint: ["sh", "/app/emqx-configure.sh"]
    environment:
      EMQX1_HOST: http://emqx:18083
      EMQX2_HOST: http://emqx2:18083
      BACKEND_URL: http://backend:8080

  minio:
    image: docker.1panel.live/minio/minio:latest
    container_name: materin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MATERIN_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MATERIN_STORAGE_SECRET_KEY:-minioadmin}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/compose/Dockerfile.backend
    container_name: materin-backend
    restart: unless-stopped
    volumes:
      - storage-local-data:/app/data/storage
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: materin
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MATERIN_NETWORK_MQTT_HOST: emqx
      MATERIN_STORAGE_TYPE: ${MATERIN_STORAGE_TYPE:-MINIO}
      MATERIN_STORAGE_ENDPOINT: ${MATERIN_STORAGE_ENDPOINT:-http://minio:9000}
      MATERIN_STORAGE_LOCAL_PUBLIC_URL: ${MATERIN_STORAGE_LOCAL_PUBLIC_URL:-}
      MATERIN_STORAGE_EXTERNAL_ENDPOINT: ${MATERIN_STORAGE_EXTERNAL_ENDPOINT:-http://host.docker.internal:9000}
      MATERIN_STORAGE_ACCESS_KEY: ${MATERIN_STORAGE_ACCESS_KEY:-minioadmin}
      MATERIN_STORAGE_SECRET_KEY: ${MATERIN_STORAGE_SECRET_KEY:-minioadmin}
      MATERIN_STORAGE_BUCKET: ${MATERIN_STORAGE_BUCKET:-materin}
      MATERIN_NETWORK_MQTT_PORT: "1883"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MATERIN_MQTT_SERVICE_PASSWORD: ${MATERIN_MQTT_SERVICE_PASSWORD:-materin-svc-dev-password}
      MATERIN_IOTDB_HOST: iotdb
      MATERIN_IOTDB_PORT: "6667"
      JDK_JAVA_OPTIONS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/device/list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: materin-frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  emqx-data:
  emqx2-data:
  storage-local-data:
  minio-data:
  iotdb-data:
